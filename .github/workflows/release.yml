# Al subir un tag vX.Y.Z: comprueba, compila el APK firmado y publica la release en GitHub.
# La app la encuentra desde Ajustes → Actualizaciones.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar que el tag coincide con la versión de app.json
        run: |
          appVersion="$(node -p "require('./app.json').expo.version")"
          if [[ "$GITHUB_REF_NAME" != "v$appVersion" ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con app.json (v$appVersion)"
            exit 1
          fi
          echo "APP_VERSION=$appVersion" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Tests, tipos y lint
        run: |
          npm test -- --ci
          npm run typecheck
          npm run lint

      - name: Restaurar la clave de firma
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.LAB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::Falta el secreto LAB_RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform android --clean

      - name: Compilar el APK de release
        working-directory: android
        env:
          LAB_RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          LAB_RELEASE_STORE_PASSWORD: ${{ secrets.LAB_RELEASE_STORE_PASSWORD }}
          LAB_RELEASE_KEY_ALIAS: ${{ secrets.LAB_RELEASE_KEY_ALIAS }}
          LAB_RELEASE_KEY_PASSWORD: ${{ secrets.LAB_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Verificar la firma
        run: |
          mkdir -p dist
          releaseApkPath="dist/laboratorio-de-bolsillo-$APP_VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$releaseApkPath"
          bash scripts/verify-apk-signature.sh "$releaseApkPath"
          echo "RELEASE_APK_PATH=$releaseApkPath" >> "$GITHUB_ENV"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RELEASE_APK_PATH" \
            --title "$APP_VERSION" \
            --generate-notes \
            --verify-tag

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
