# Al subir un tag vX.Y.Z: comprueba, compila los APK firmados (universal y por arquitectura) y publica la release en GitHub.
# La app la encuentra desde Ajustes → Actualizaciones.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar que el tag coincide con la versión de app.json
        run: |
          appVersion="$(node -p "require('./app.json').expo.version")"
          if [[ "$GITHUB_REF_NAME" != "v$appVersion" ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con app.json (v$appVersion)"
            exit 1
          fi
          echo "APP_VERSION=$appVersion" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Tests, tipos y lint
        run: |
          npm test -- --ci
          npm run typecheck
          npm run lint

      - name: Restaurar la clave de firma
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.LAB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::Falta el secreto LAB_RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform android --clean

      - name: Compilar los APK de release
        working-directory: android
        env:
          LAB_RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          LAB_RELEASE_STORE_PASSWORD: ${{ secrets.LAB_RELEASE_STORE_PASSWORD }}
          LAB_RELEASE_KEY_ALIAS: ${{ secrets.LAB_RELEASE_KEY_ALIAS }}
          LAB_RELEASE_KEY_PASSWORD: ${{ secrets.LAB_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      # Con el plugin withAndroidAbiSplits salen tres APK: universal, arm64-v8a y armeabi-v7a.
      - name: Copiar los APK y verificar la firma
        run: |
          mkdir -p dist
          apkOutputDirectory=android/app/build/outputs/apk/release
          distributionApkPrefix="dist/laboratorio-de-bolsillo-$APP_VERSION"
          cp "$apkOutputDirectory/app-universal-release.apk" "$distributionApkPrefix.apk"
          cp "$apkOutputDirectory/app-arm64-v8a-release.apk" "$distributionApkPrefix-arm64-v8a.apk"
          cp "$apkOutputDirectory/app-armeabi-v7a-release.apk" "$distributionApkPrefix-armeabi-v7a.apk"
          for releaseApkPath in "$distributionApkPrefix".apk "$distributionApkPrefix"-*.apk; do
            bash scripts/verify-apk-signature.sh "$releaseApkPath"
          done
          ls -l dist

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        # El universal se sube primero y solo: las versiones de la app hasta la 0.4.5 cogen el
        # primer .apk de la release, y ese debe servir en cualquier móvil.
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/laboratorio-de-bolsillo-$APP_VERSION.apk" \
            --title "$APP_VERSION" \
            --generate-notes \
            --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/laboratorio-de-bolsillo-"$APP_VERSION"-*.apk

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
